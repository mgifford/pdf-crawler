name: "2 - Analyse PDFs for Accessibility"

on:
  workflow_dispatch:
    inputs:
      keep_files:
        description: "Keep downloaded PDF files after analysis (default: false)"
        required: false
        default: "false"
        type: string
      site:
        description: "Site/domain to restrict analysis to (e.g. example.com). Leave blank to process all pending entries."
        required: false
        default: ""
        type: string
      issue_number:
        description: "Issue number to update (used by auto-continue runs)."
        required: false
        default: ""
        type: string
      crawl_url:
        description: "Original crawl URL (used by auto-continue runs)."
        required: false
        default: ""
        type: string
      max_pages:
        description: "Original crawl max pages (used by auto-continue runs)."
        required: false
        default: "500"
        type: string
      max_pdfs:
        description: "Maximum PDFs to process for this analysis pass."
        required: false
        default: "200"
        type: string
      run_verapdf:
        description: "Whether to run veraPDF checks (true/false)."
        required: false
        default: "false"
        type: string
      crawler_version:
        description: "Crawler version metadata (original/bloom)."
        required: false
        default: "original"
        type: string
      scan_language:
        description: "Preferred report language (en/fr)."
        required: false
        default: "en"
        type: string
      continue_attempt:
        description: "Auto-continue attempt counter."
        required: false
        default: "0"
        type: string
  workflow_run:
    workflows: ["1 - Crawl Site for PDFs"]
    types: [completed]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: explain why the crawl was skipped (non-scan issue or title mismatch)
  # ---------------------------------------------------------------------------
  note_crawl_skipped:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Log – crawl workflow was skipped
        run: |
          echo "The crawl workflow run ${{ github.event.workflow_run.id }} concluded with 'skipped'."
          echo "This typically means the triggering issue title did not start with 'SCAN:' or 'PDF-CRAWL:'."
          echo "No analysis is needed. This is expected behaviour for non-scan issues."
          echo ""
          echo "NOTE FOR DEBUGGING:"
          echo "  - This job (note_crawl_skipped) only runs when the crawl workflow was SKIPPED."
          echo "  - The report_crawl_failure job only runs when the crawl workflow FAILED or was CANCELLED."
          echo "  - When the crawl succeeds, both of those jobs are skipped (they show as 'skipped' in the UI)."
          echo "  - A 'skipped' status on note_crawl_skipped or report_crawl_failure means the crawl"
          echo "    completed successfully and the analyse job ran instead."
          echo ""
          {
            echo "## ⏭️ Crawl workflow was skipped"
            echo ""
            echo "Run ID: \`${{ github.event.workflow_run.id }}\`"
            echo ""
            echo "The upstream crawl workflow concluded with **skipped**, which typically means"
            echo "the triggering issue title did not start with \`SCAN:\` or \`PDF-CRAWL:\`."
            echo "No accessibility analysis is needed."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job 1: report a failed upstream crawl back to the originating issue
  # ---------------------------------------------------------------------------
  report_crawl_failure:
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest

    steps:
      - name: Download scan metadata artifact
        id: download_meta
        continue-on-error: true   # artifact may not exist if crawl failed very early
        uses: actions/download-artifact@v8
        with:
          name: scan-meta-${{ github.event.workflow_run.id }}
          path: scan-meta/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read scan metadata
        id: meta
        run: |
          ISSUE_NUMBER=""
          CRAWL_URL=""
          if [ -f scan-meta/issue_number.txt ]; then
            ISSUE_NUMBER=$(cat scan-meta/issue_number.txt | tr -d '[:space:]')
          fi
          if [ -f scan-meta/crawl_url.txt ]; then
            CRAWL_URL=$(cat scan-meta/crawl_url.txt | tr -d '[:space:]')
          fi
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "crawl_url=$CRAWL_URL"       >> "$GITHUB_OUTPUT"

      - name: Comment crawl failure on issue
        if: steps.meta.outputs.issue_number != ''
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue_number }}
          CRAWL_URL: ${{ steps.meta.outputs.crawl_url }}
          CRAWL_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
          CRAWL_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) return;
            const crawlUrl   = process.env.CRAWL_URL  || '(unknown)';
            const runUrl     = process.env.CRAWL_RUN_URL;
            const conclusion = process.env.CRAWL_CONCLUSION || 'failure';

            const isCancelled = conclusion === 'cancelled';
            const headline = isCancelled
              ? `⏱️ **Crawl cancelled** for \`${crawlUrl}\`.`
              : `❌ **Crawl failed** for \`${crawlUrl}\`.`;
            const reason = isCancelled
              ? `The crawl workflow was cancelled (likely a timeout).`
              : `The crawl workflow did not complete successfully.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber,
              body: [
                headline,
                ``,
                reason,
                `Please check the [workflow run](${runUrl}) for details.`,
                ``,
                `**Common causes:**`,
                `- The URL is not reachable or returns errors`,
                `- A timeout was exceeded (crawl job limit is 75 minutes)`,
                `- An unexpected error occurred during crawling`,
                ``,
                `**To retry:** close and reopen this issue to trigger a fresh crawl.`,
              ].join('\n')
            });
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issueNumber,
                name: 'scan-in-progress'
              });
            } catch (err) {
              if (err.status !== 404) throw err;
            }
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issueNumber,
                labels: ['scan-failed']
              });
            } catch (_) {}

            core.summary
              .addHeading(isCancelled ? '⏱️ Crawl cancelled' : '❌ Crawl failed', 2)
              .addRaw(`Issue: [#${issueNumber}](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${issueNumber})`)
              .addEOL()
              .addRaw(`Crawl URL: \`${crawlUrl}\``)
              .addEOL()
              .addRaw(`Conclusion: \`${conclusion}\``)
              .addEOL()
              .addRaw(`[View crawl run](${runUrl})`)
              .write();

  # ---------------------------------------------------------------------------
  # Job 2: run accessibility analysis for a successful crawl
  # ---------------------------------------------------------------------------
  analyse:
    # When triggered by workflow_run, only run if the crawl succeeded
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Debug – log triggering workflow context
        run: |
          echo "=== Triggering event ==="
          echo "Event name:            ${{ github.event_name }}"
          echo "Workflow run ID:       ${{ github.event.workflow_run.id }}"
          echo "Workflow run name:     ${{ github.event.workflow_run.name }}"
          echo "Workflow run status:   ${{ github.event.workflow_run.status }}"
          echo "Workflow run conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Workflow run HTML URL: ${{ github.event.workflow_run.html_url }}"
          echo "Head branch:           ${{ github.event.workflow_run.head_branch }}"
          echo "Head SHA:              ${{ github.event.workflow_run.head_sha }}"
          echo "This run ID:           ${{ github.run_id }}"
          echo "Ref:                   ${{ github.ref_name }}"
          echo "Artifact names expected:"
          echo "  crawled-pdfs-${{ github.event.workflow_run.id }}"
          echo "  scan-meta-${{ github.event.workflow_run.id }}"
          echo ""
          echo "=== Job visibility note ==="
          echo "The 'note_crawl_skipped' job runs ONLY when the crawl was skipped (non-SCAN issue)."
          echo "The 'report_crawl_failure' job runs ONLY when the crawl failed or was cancelled."
          echo "When those two jobs appear as 'skipped' in the UI it means the crawl succeeded"
          echo "and this 'analyse' job is running instead — that is the expected happy path."

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # OPTIMIZED: Combined python environment setup and uv initialization into one step with automated caching
      - name: Set up uv & Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Download crawled PDFs artifact
        id: download_pdfs
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: crawled-pdfs-${{ github.event.workflow_run.id }}
          path: crawled_files/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download scan metadata artifact
        id: download_meta
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: scan-meta-${{ github.event.workflow_run.id }}
          path: scan-meta/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Debug – check downloaded artifacts
        if: github.event_name == 'workflow_run'
        run: |
          echo "=== PDF artifact download outcome: ${{ steps.download_pdfs.outcome }} ==="
          echo "=== Metadata artifact download outcome: ${{ steps.download_meta.outcome }} ==="
          echo ""
          echo "--- crawled_files/ ---"
          if [ -d crawled_files ]; then
            find crawled_files -type f | sort || echo "(directory is empty)"
          else
            echo "(directory does not exist)"
          fi
          echo ""
          echo "--- scan-meta/ ---"
          if [ -d scan-meta ]; then
            ls -la scan-meta/ || echo "(directory is empty)"
            for f in scan-meta/*.txt; do
              [ -f "$f" ] && echo "  $f: $(cat "$f")"
            done
          else
            echo "(directory does not exist)"
          fi
          echo ""
          if [ "${{ steps.download_pdfs.outcome }}" = "failure" ]; then
            echo "::warning::PDF artifact 'crawled-pdfs-${{ github.event.workflow_run.id }}' was not found."
            echo "::warning::This may mean the crawl produced no PDF files, the artifact expired, or the crawl run ID is mismatched."
          fi
          if [ "${{ steps.download_meta.outcome }}" = "failure" ]; then
            echo "::warning::Scan metadata artifact 'scan-meta-${{ github.event.workflow_run.id }}' was not found."
          fi

      - name: Read scan metadata
        id: meta
        env:
          DISPATCH_SITE: ${{ github.event.inputs.site }}
          DISPATCH_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          DISPATCH_CRAWL_URL: ${{ github.event.inputs.crawl_url }}
          DISPATCH_MAX_PAGES: ${{ github.event.inputs.max_pages }}
          DISPATCH_MAX_PDFS: ${{ github.event.inputs.max_pdfs }}
          DISPATCH_RUN_VERAPDF: ${{ github.event.inputs.run_verapdf }}
          DISPATCH_CRAWLER_VERSION: ${{ github.event.inputs.crawler_version }}
          DISPATCH_SCAN_LANGUAGE: ${{ github.event.inputs.scan_language }}
          DISPATCH_CONTINUE_ATTEMPT: ${{ github.event.inputs.continue_attempt }}
        run: |
          ISSUE_NUMBER=""
          CRAWL_URL=""
          CRAWL_SITE=""
          MAX_PAGES="500"
          MAX_PDFS="200"
          RUN_VERAPDF="false"
          CRAWLER_VERSION="original"
          SCAN_LANGUAGE="en"
          CONTINUE_ATTEMPT="0"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # workflow_run: read metadata from the scan-meta artifact left by the crawl.
            if [ -f scan-meta/issue_number.txt ]; then
              ISSUE_NUMBER=$(cat scan-meta/issue_number.txt | tr -d '[:space:]')
            fi
            if [ -f scan-meta/crawl_url.txt ]; then
              CRAWL_URL=$(cat scan-meta/crawl_url.txt | tr -d '[:space:]')
            fi
            if [ -f scan-meta/crawl_site.txt ]; then
              CRAWL_SITE=$(cat scan-meta/crawl_site.txt | tr -d '[:space:]')
            fi
            if [ -f scan-meta/max_pages.txt ]; then
              PARSED=$(cat scan-meta/max_pages.txt | tr -d '[:space:]')
              if echo "$PARSED" | grep -Eq '^[0-9]+$'; then
                MAX_PAGES="$PARSED"
              fi
            fi
            if [ -f scan-meta/max_pdfs.txt ]; then
              PARSED=$(cat scan-meta/max_pdfs.txt | tr -d '[:space:]')
              if echo "$PARSED" | grep -Eq '^[0-9]+$'; then
                MAX_PDFS="$PARSED"
              fi
            fi
            if [ -f scan-meta/verapdf.txt ]; then
              PARSED=$(cat scan-meta/verapdf.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
              if [ "$PARSED" = "true" ]; then
                RUN_VERAPDF="true"
              fi
            fi
            if [ -f scan-meta/crawler_version.txt ]; then
              CRAWLER_VERSION=$(cat scan-meta/crawler_version.txt | tr -d '[:space:]')
            fi
            if [ -f scan-meta/language.txt ]; then
              PARSED_LANG=$(cat scan-meta/language.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
              if [ "$PARSED_LANG" = "fr" ] || [ "$PARSED_LANG" = "en" ]; then
                SCAN_LANGUAGE="$PARSED_LANG"
              fi
            fi
          else
            # workflow_dispatch: read the optional site input directly.
            CRAWL_SITE=$(echo "$DISPATCH_SITE" | tr -d '[:space:]')
            ISSUE_NUMBER=$(echo "$DISPATCH_ISSUE_NUMBER" | tr -d '[:space:]')
            CRAWL_URL=$(echo "$DISPATCH_CRAWL_URL" | tr -d '[:space:]')
            PARSED=$(echo "$DISPATCH_MAX_PAGES" | tr -d '[:space:]')
            if echo "$PARSED" | grep -Eq '^[0-9]+$'; then
              MAX_PAGES="$PARSED"
            fi
            PARSED=$(echo "$DISPATCH_MAX_PDFS" | tr -d '[:space:]')
            if echo "$PARSED" | grep -Eq '^[0-9]+$'; then
              MAX_PDFS="$PARSED"
            fi
            PARSED=$(echo "$DISPATCH_RUN_VERAPDF" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
            if [ "$PARSED" = "true" ]; then
              RUN_VERAPDF="true"
            fi
            PARSED=$(echo "$DISPATCH_CRAWLER_VERSION" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
            if [ "$PARSED" = "bloom" ] || [ "$PARSED" = "original" ]; then
              CRAWLER_VERSION="$PARSED"
            fi
            PARSED_LANG=$(echo "$DISPATCH_SCAN_LANGUAGE" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
            if [ "$PARSED_LANG" = "fr" ] || [ "$PARSED_LANG" = "en" ]; then
              SCAN_LANGUAGE="$PARSED_LANG"
            fi
            PARSED=$(echo "$DISPATCH_CONTINUE_ATTEMPT" | tr -d '[:space:]')
            if echo "$PARSED" | grep -Eq '^[0-9]+$'; then
              CONTINUE_ATTEMPT="$PARSED"
            fi
          fi
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "crawl_url=$CRAWL_URL"       >> "$GITHUB_OUTPUT"
          echo "crawl_site=$CRAWL_SITE"     >> "$GITHUB_OUTPUT"
          echo "max_pages=$MAX_PAGES"       >> "$GITHUB_OUTPUT"
          echo "max_pdfs=$MAX_PDFS"         >> "$GITHUB_OUTPUT"
          echo "run_verapdf=$RUN_VERAPDF"   >> "$GITHUB_OUTPUT"
          echo "crawler_version=$CRAWLER_VERSION" >> "$GITHUB_OUTPUT"
          echo "scan_language=$SCAN_LANGUAGE" >> "$GITHUB_OUTPUT"
          echo "continue_attempt=$CONTINUE_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Pull latest manifest
        run: |
          git pull --rebase origin "${{ github.ref_name }}" || true

      - name: Install Bloom Works crawler
        if: steps.meta.outputs.crawler_version == 'bloom'
        run: |
          uv pip install git+https://github.com/bloom-works/simplA11yPDFCrawler.git@0df4d4f3eca1f0bbf3898046ef5c2c8f9ddd86b0

      - name: Install veraPDF
        if: steps.meta.outputs.run_verapdf == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends default-jre-headless
          VERAPDF_VERSION="1.28.2"
          MAVEN_BASE="https://repo1.maven.org/maven2/org/verapdf/apps/greenfield-apps"
          mkdir -p /tmp/verapdf-install
          curl -fsSL \
            "${MAVEN_BASE}/${VERAPDF_VERSION}/greenfield-apps-${VERAPDF_VERSION}.jar" \
            -o /tmp/verapdf-install/greenfield-apps.jar
          printf '#!/bin/sh\nexec java -cp /tmp/verapdf-install/greenfield-apps.jar org.verapdf.apps.GreenfieldCliWrapper "$@"\n' \
            > /tmp/verapdf-install/verapdf
          chmod +x /tmp/verapdf-install/verapdf
          echo "/tmp/verapdf-install" >> "$GITHUB_PATH"
          echo "veraPDF installed (Maven Central, v${VERAPDF_VERSION})"
          /tmp/verapdf-install/verapdf --version || true

      - name: Analyse PDFs for accessibility issues
        env:
          CRAWL_SITE:      ${{ steps.meta.outputs.crawl_site }}
          CRAWL_MAX_PAGES: ${{ steps.meta.outputs.max_pages }}
          CRAWL_MAX_PDFS:  ${{ steps.meta.outputs.max_pdfs }}
          RUN_VERAPDF:     ${{ steps.meta.outputs.run_verapdf }}
        run: |
          KEEP_FLAG=""
          if [ "${{ github.event.inputs.keep_files }}" = "true" ]; then
            KEEP_FLAG="--keep-files"
          fi
          SITE_FLAG=""
          if [ -n "$CRAWL_SITE" ]; then
            SITE_FLAG="--site $CRAWL_SITE"
          fi
          MAX_PDFS="${CRAWL_MAX_PDFS:-200}"
          if [ -z "$MAX_PDFS" ] || ! echo "$MAX_PDFS" | grep -Eq '^[0-9]+$'; then
            MAX_PDFS="200"
          fi
          MAX_FILES_FLAG="--max-files $MAX_PDFS"
          VERAPDF_FLAG=""
          if [ "$RUN_VERAPDF" = "true" ]; then
            VERAPDF_FLAG="--verapdf"
          fi
          CRAWLER_VERSION_FLAG=""
          if [ "${{ steps.meta.outputs.crawler_version }}" = "bloom" ]; then
            CRAWLER_VERSION_FLAG="--crawler-version bloom"
          fi
          python scripts/pdf_analyser.py \
            --manifest reports/manifest.yaml \
            --crawled-dir crawled_files \
            --max-age-days 2 \
            --total-timeout 2400 \
            $SITE_FLAG \
            $MAX_FILES_FLAG \
            $VERAPDF_FLAG \
            $CRAWLER_VERSION_FLAG \
            $KEEP_FLAG

      - name: Check stale entries from previous crawls
        id: stale_check
        env:
          CRAWL_URL:    ${{ steps.meta.outputs.crawl_url }}
          CRAWL_SITE:   ${{ steps.meta.outputs.crawl_site }}
        run: |
          STALE_COUNT=$(cat /tmp/pdf_analyser_stale.txt 2>/dev/null || echo "0")
          if ! echo "$STALE_COUNT" | grep -Eq '^[0-9]+$'; then
            STALE_COUNT="0"
          fi
          echo "stale_count=$STALE_COUNT" >> "$GITHUB_OUTPUT"
          NEEDS_RECRAWL="false"
          if [ "$STALE_COUNT" -gt 1 ] && [ -n "$CRAWL_SITE" ]; then
            NEEDS_RECRAWL="true"
          fi
          echo "needs_recrawl=$NEEDS_RECRAWL" >> "$GITHUB_OUTPUT"
          echo "Stale entries: $STALE_COUNT, needs_recrawl: $NEEDS_RECRAWL"
          echo ""
          echo "=== Stale entry explanation ==="
          echo "Stale entries are manifest entries that were recorded as 'pending' in a"
          echo "previous crawl run, but whose downloaded PDF files are no longer available."
          echo "This happens when the GitHub Actions artifact from the previous crawl has"
          echo "expired (default retention: 90 days) or when the crawl was interrupted."
          echo "Stale entries do NOT indicate a failure of the current scan — the current"
          echo "scan ran successfully. To analyse the remaining PDFs, re-crawl the site."
          if [ "$STALE_COUNT" -gt 0 ]; then
            echo "::notice::$STALE_COUNT stale manifest entries were skipped (no local file). Re-crawl $CRAWL_SITE to analyse them."
          fi

      - name: Generate accessibility reports
        env:
          CRAWL_URL: ${{ steps.meta.outputs.crawl_url }}
          CRAWL_SITE: ${{ steps.meta.outputs.crawl_site }}
          CRAWLER_VERSION: ${{ steps.meta.outputs.crawler_version }}
          SCAN_LANGUAGE: ${{ steps.meta.outputs.scan_language }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          PAGES_BASE="https://${REPO_OWNER}.github.io/${REPO_NAME}"
          RUN_URL="https://github.com/${REPO_OWNER}/${REPO_NAME}/actions/runs/${RUN_ID}"
          SITE_FLAG=""
          COMMENT_FLAG=""
          if [ -n "$CRAWL_SITE" ]; then
            SITE_FLAG="--site $CRAWL_SITE"
            COMMENT_FLAG="--issue-comment-file /tmp/issue_comment.md"
          fi
          CRAWLED_DIR_FLAG=""
          if [ -d crawled_files ]; then
            CRAWLED_DIR_FLAG="--crawled-dir crawled_files"
          fi
          SPOT_CHECK_FLAG=""
          if [ -f scan-meta/spot_check.json ]; then
            SPOT_CHECK_FLAG="--spot-check-file scan-meta/spot_check.json"
          fi
          ENGINE_FLAG=""
          if [ "$CRAWLER_VERSION" = "bloom" ]; then
            ENGINE_FLAG="--engine bloom"
          else
            ENGINE_FLAG="--engine original"
          fi
          python scripts/generate_report.py \
            --manifest reports/manifest.yaml \
            --report-dir reports \
            $SITE_FLAG \
            $COMMENT_FLAG \
            $CRAWLED_DIR_FLAG \
            $SPOT_CHECK_FLAG \
            $ENGINE_FLAG \
            --html-dir docs \
            --archive-dir docs/reports \
            --pages-base "$PAGES_BASE" \
            --run-url "$RUN_URL" \
            --crawl-url "$CRAWL_URL" \
            --default-lang "$SCAN_LANGUAGE"

      - name: Compute site pending count
        id: site_pending
        env:
          CRAWL_SITE: ${{ steps.meta.outputs.crawl_site }}
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          from pathlib import Path

          site = (os.environ.get('CRAWL_SITE') or '').strip()
          report_path = Path('reports/report.json')
          pending = 0
          total = 0
          if report_path.exists():
              data = json.loads(report_path.read_text(encoding='utf-8'))
              files = data.get('files') or []
              for f in files:
                  if site and f.get('site') != site:
                      continue
                  total += 1
                  if f.get('status') == 'pending':
                      pending += 1
          out_path = Path(os.environ['GITHUB_OUTPUT'])
          with out_path.open('a', encoding='utf-8') as fh:
              fh.write(f"pending={pending}\n")
              fh.write(f"total={total}\n")
          print(f"Site scope: {site or 'all'} | total={total} | pending={pending}")
          PYEOF

      - name: Commit updated manifest and reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f reports/crawled_urls.csv ]; then
            cp reports/crawled_urls.csv docs/reports/crawled_urls.csv
          fi
          git add reports/ docs/report.html docs/reports.html docs/reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: update accessibility reports"
            PUSH_DONE=false
            for attempt in 1 2 3; do
              if git push; then
                PUSH_DONE=true
                break
              fi
              echo "Push attempt $attempt failed – fetching and merging (ours) then retrying…"
              git fetch origin "${{ github.ref_name }}"
              git merge --no-edit -X ours FETCH_HEAD || { echo "::warning::Merge failed on attempt $attempt; aborting."; git merge --abort 2>/dev/null || true; }
            done
            if [ "$PUSH_DONE" = "false" ]; then
              git push || echo "::warning::All push attempts exhausted; reports saved as workflow artifact."
            fi
          fi

      - name: Upload accessibility report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: |
            reports/report.md
            reports/report.json
            reports/report.csv
            reports/crawled_urls.csv
            reports/manifest.yaml
          retention-days: 30

      - name: Comment analysis results on issue
        id: comment
        if: steps.meta.outputs.issue_number != ''
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue_number }}
          CRAWL_URL: ${{ steps.meta.outputs.crawl_url }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
          SITE_PENDING: ${{ steps.site_pending.outputs.pending }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.warning(`Skipping issue comment: invalid issue number '${process.env.ISSUE_NUMBER}'.`);
              return;
            }
            const crawlUrl  = process.env.CRAWL_URL;
            const repoOwner = process.env.REPO_OWNER;
            const repoName  = process.env.REPO_NAME;
            const runId     = process.env.RUN_ID;

            const reportsBase = `https://${repoOwner}.github.io/${repoName}`;
            const actionsUrl  = `https://github.com/${repoOwner}/${repoName}/actions/runs/${runId}`;

            let body;
            try {
              const fs = require('fs');
              body = fs.readFileSync('/tmp/issue_comment.md', 'utf8');
            } catch (_) {
              body = [
                `📊 **Accessibility analysis complete** for \`${crawlUrl}\`.`,
                ``,
                `Per-site report links were unavailable for this run.`,
                `Use report history and the workflow run logs below:`,
                `- [Reports history](${reportsBase}/reports.html)`,
                ``,
                `[View workflow run](${actionsUrl})`
              ].join('\n');
            }

            const { data: commentData } = await github.rest.issues.createComment({
              owner: repoOwner,
              repo:  repoName,
              issue_number: issueNumber,
              body,
            });

            core.setOutput('comment_url', commentData.html_url);

            for (const label of ['scan-in-progress', 'scan-failed', 'scan-complete', 'scan-partial']) {
              try {
                await github.rest.issues.removeLabel({
                  owner: repoOwner,
                  repo:  repoName,
                  issue_number: issueNumber,
                  name: label,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            }

            const pendingCount = parseInt(process.env.SITE_PENDING || '0', 10) || 0;
            const finalLabel = pendingCount > 0 ? 'scan-partial' : 'scan-complete';

            await github.rest.issues.addLabels({
              owner: repoOwner,
              repo:  repoName,
              issue_number: issueNumber,
              labels: [finalLabel]
            });

      - name: Auto-continue partial scan
        if: >-
          steps.meta.outputs.issue_number != '' &&
          steps.site_pending.outputs.pending != '0'
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue_number }}
          CRAWL_URL: ${{ steps.meta.outputs.crawl_url }}
          CRAWL_SITE: ${{ steps.meta.outputs.crawl_site }}
          CRAWL_MAX_PAGES: ${{ steps.meta.outputs.max_pages }}
          CRAWL_MAX_PDFS: ${{ steps.meta.outputs.max_pdfs }}
          RUN_VERAPDF: ${{ steps.meta.outputs.run_verapdf }}
          CRAWLER_VERSION: ${{ steps.meta.outputs.crawler_version }}
          SCAN_LANGUAGE: ${{ steps.meta.outputs.scan_language }}
          CONTINUE_ATTEMPT: ${{ steps.meta.outputs.continue_attempt }}
          SITE_PENDING: ${{ steps.site_pending.outputs.pending }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAX_CONTINUE_ATTEMPTS: "5"
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) return;

            const pendingCount = parseInt(process.env.SITE_PENDING || '0', 10) || 0;
            if (pendingCount <= 0) return;

            const attempt = parseInt(process.env.CONTINUE_ATTEMPT || '0', 10) || 0;
            const maxAttempts = parseInt(process.env.MAX_CONTINUE_ATTEMPTS || '5', 10) || 5;

            if (attempt >= maxAttempts) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: [
                  `⚠️ **Partial scan paused after ${attempt} automatic continuation attempts.**`,
                  '',
                  `There are still **${pendingCount} pending PDFs** for this site.`,
                  `A fresh crawl may be needed to complete the remainder.`,
                  '',
                  `[View latest analysis run](${process.env.RUN_URL})`
                ].join('\n'),
              });
              return;
            }

            const nextAttempt = attempt + 1;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'analyse.yml',
              ref: context.ref,
              inputs: {
                keep_files: 'false',
                site: process.env.CRAWL_SITE || '',
                issue_number: String(issueNumber),
                crawl_url: process.env.CRAWL_URL || '',
                max_pages: process.env.CRAWL_MAX_PAGES || '500',
                max_pdfs: process.env.CRAWL_MAX_PDFS || '200',
                run_verapdf: process.env.RUN_VERAPDF || 'false',
                crawler_version: process.env.CRAWLER_VERSION || 'original',
                scan_language: process.env.SCAN_LANGUAGE || 'en',
                continue_attempt: String(nextAttempt),
              },
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `🔁 **Partial scan continues automatically** (${nextAttempt}/${maxAttempts}).`,
                '',
                `Pending PDFs remaining after this run: **${pendingCount}**.`,
                `A follow-up analysis pass has been queued.`,
                '',
                `[View latest analysis run](${process.env.RUN_URL})`
              ].join('\n'),
            });

      - name: Link issue comment URL to reports index
        if: >-
          github.event_name == 'workflow_run' &&
          steps.meta.outputs.issue_number != '' &&
          steps.comment.outputs.comment_url != ''
        env:
          COMMENT_URL: ${{ steps.comment.outputs.comment_url }}
          CRAWL_SITE:  ${{ steps.meta.outputs.crawl_site }}
        run: |
          python3 - << 'PYEOF'
          import json, os, sys
          from pathlib import Path

          archive_dir = 'docs/reports'
          site        = os.environ.get('CRAWL_SITE', '').strip()
          comment_url = os.environ.get('COMMENT_URL', '').strip()

          if not site or not comment_url:
              print('Skipping: CRAWL_SITE or COMMENT_URL is empty.')
              sys.exit(0)

          index_path = Path(archive_dir) / 'index.json'
          if not index_path.exists():
              print(f'Skipping: {index_path} does not exist.')
              sys.exit(0)

          data = json.loads(index_path.read_text(encoding='utf-8'))
          updated = False
          for entry in data:
              if entry.get('site') == site and not entry.get('issue_url'):
                  entry['issue_url'] = comment_url
                  updated = True
                  break

          if updated:
              index_path.write_text(
                  json.dumps(data, indent=2, default=str), encoding='utf-8'
              )
              print(f'Updated index.json: issue_url={comment_url!r} for site={site!r}')
          else:
              print(f'No matching entry without issue_url found for site={site!r}')
          PYEOF
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/reports/index.json
          if git diff --cached --quiet; then
            echo "No index changes to commit."
          else
            git commit -m "chore: link issue comment to reports index"
            PUSH_DONE=false
            for attempt in 1 2 3; do
              if git push; then
                PUSH_DONE=true
                break
              fi
              echo "Push attempt $attempt failed – pulling and retrying…"
              git pull --rebase origin "${{ github.ref_name }}" || { echo "::warning::Rebase failed on attempt $attempt; aborting."; git rebase --abort 2>/dev/null || true; }
            done
            if [ "$PUSH_DONE" = "false" ]; then
              git push || echo "::warning::All push attempts exhausted."
            fi
          fi

      - name: Write workflow summary
        if: always()
        env:
          EVENT_NAME:      ${{ github.event_name }}
          ISSUE_NUMBER:    ${{ steps.meta.outputs.issue_number }}
          CRAWL_URL:       ${{ steps.meta.outputs.crawl_url }}
          CRAWL_SITE:      ${{ steps.meta.outputs.crawl_site }}
          STALE_COUNT:     ${{ steps.stale_check.outputs.stale_count }}
          NEEDS_RECRAWL:   ${{ steps.stale_check.outputs.needs_recrawl }}
          REPO_OWNER:      ${{ github.repository_owner }}
          REPO_NAME:       ${{ github.event.repository.name }}
          RUN_ID:          ${{ github.run_id }}
          CRAWL_RUN_ID:    ${{ github.event.workflow_run.id }}
          PDF_OUTCOME:     ${{ steps.download_pdfs.outcome }}
          META_OUTCOME:    ${{ steps.download_meta.outcome }}
        run: |
          CRAWL_URL="${CRAWL_URL:-unknown}"
          ISSUE_NUMBER="${ISSUE_NUMBER:-}"
          STALE_COUNT="${STALE_COUNT:-0}"
          REPO_OWNER="${REPO_OWNER:-}"
          REPO_NAME="${REPO_NAME:-}"
          RUN_ID="${RUN_ID:-}"
          CRAWL_RUN_ID="${CRAWL_RUN_ID:-}"
          {
            echo "## 📊 Accessibility Analysis Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Site | \`${CRAWL_URL}\` |"
            if [ -n "$ISSUE_NUMBER" ]; then
              echo "| Issue | [#${ISSUE_NUMBER}](https://github.com/${REPO_OWNER}/${REPO_NAME}/issues/${ISSUE_NUMBER}) |"
            fi
            if [ -n "$CRAWL_RUN_ID" ] && [ "$EVENT_NAME" = "workflow_run" ]; then
              echo "| Crawl run | [View](https://github.com/${REPO_OWNER}/${REPO_NAME}/actions/runs/${CRAWL_RUN_ID}) |"
            fi
            echo "| Analysis run | [View](https://github.com/${REPO_OWNER}/${REPO_NAME}/actions/runs/${RUN_ID}) |"
            echo "| PDF artifact | \`${PDF_OUTCOME:-n/a}\` |"
            echo "| Metadata artifact | \`${META_OUTCOME:-n/a}\` |"
            echo "| Stale entries skipped | ${STALE_COUNT} |"
            echo ""
            if [ "$STALE_COUNT" -gt 0 ]; then
              echo "### ♻️ Stale Entries Detected"
              echo ""
              echo "${STALE_COUNT} manifest entries from a previous crawl could not be analysed"
              echo "because their downloaded files are no longer available."
              echo ""
              echo "**This is not a scan failure.** The current scan completed successfully."
              echo "To analyse the remaining PDFs, reopen the issue to trigger a fresh crawl."
            fi
            echo ""
            echo "### ℹ️ About Skipped Jobs"
            echo ""
            echo "The \`note_crawl_skipped\` and \`report_crawl_failure\` jobs appear as"
            echo "**skipped** in the workflow run UI when this \`analyse\` job runs."
            echo "That is expected — those jobs only run when the crawl was skipped or failed."
            echo "A skipped status on those jobs means **the crawl succeeded** and this"
            echo "analysis job ran instead."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close issue after scan and report
        if: >-
          steps.meta.outputs.issue_number != '' &&
          steps.site_pending.outputs.pending == '0'
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue_number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) return;
            await github.rest.issues.update({
              owner: process.env.REPO_OWNER,
              repo:  process.env.REPO_NAME,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Note stale entries from previous crawl
        if: >-
          github.event_name == 'workflow_run' &&
          steps.meta.outputs.issue_number != '' &&
          steps.stale_check.outputs.needs_recrawl == 'true'
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER:  ${{ steps.meta.outputs.issue_number }}
          CRAWL_URL:     ${{ steps.meta.outputs.crawl_url }}
          CRAWL_SITE:    ${{ steps.meta.outputs.crawl_site }}
          STALE_COUNT:   ${{ steps.stale_check.outputs.stale_count }}
          RUN_URL:       https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) return;
            const crawlUrl   = process.env.CRAWL_URL || '(unknown)';
            const staleCount = process.env.STALE_COUNT || '0';
            const runUrl     = process.env.RUN_URL;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber,
              body: [
                `♻️ **Heads up: ${staleCount} PDF entries from a previous crawl of \`${crawlUrl}\` could not be analysed.**`,
                ``,
                `These entries are still marked as pending in the manifest, but their`,
                `downloaded files are no longer available (the GitHub Actions artifact`,
                `from the previous crawl has likely expired).`,
                ``,
                `The current scan has been completed and this issue has been closed.`,
                `To analyse the remaining PDFs, reopen this issue (or open a new one`,
                `with the same URL) to trigger a fresh crawl.`,
                ``,
                `<a href="${runUrl}">View workflow run</a>`,
              ].join('\n'),
            });

      - name: Handle analysis cancellation or timeout
        if: >-
          cancelled() &&
          github.event_name == 'workflow_run' &&
          steps.meta.outputs.issue_number != ''
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER:  ${{ steps.meta.outputs.issue_number }}
          CRAWL_URL:     ${{ steps.meta.outputs.crawl_url }}
          CRAWL_MAX_PDFS: ${{ steps.meta.outputs.max_pdfs }}
          RUN_URL:       https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) return;
            const crawlUrl   = process.env.CRAWL_URL || '(unknown)';
            const runUrl     = process.env.RUN_URL;
            const currentMax = parseInt(process.env.CRAWL_MAX_PDFS, 10) || 200;
            const newMax     = Math.max(25, Math.floor(currentMax / 2));

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber,
            });
            let body = issue.body || '';
            if (/^PDFs:\s*\d+/mi.test(body)) {
              body = body.replace(/^PDFs:\s*\d+/mi, `PDFs: ${newMax}`);
            } else {
              body = body.trim() + `\nPDFs: ${newMax}`;
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber,
              body,
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNumber,
              body: [
                `⏱️ **Analysis timed out** for \`${crawlUrl}\`.`,
                ``,
                `The accessibility analysis job exceeded its time limit (60 minutes) and was cancelled.`,
                `Please check the [workflow run](${runUrl}) for details.`,
                ``,
                `To help the next attempt succeed, the PDF analysis limit has been automatically`,
                `reduced to **${newMax} PDFs** (was ${currentMax}).`,
                `Close and reopen this issue to retry with the smaller batch size.`,
                ``,
                `**Debugging tips:**`,
                `- Check the workflow run logs for the last PDF being analysed before the timeout`,
                `- Consider adding \`PDFs: ${newMax}\` to the issue body to set the limit explicitly`,
              ].join('\n'),
            });
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issueNumber,
                name: 'scan-in-progress',
              });
            } catch (err) {
              if (err.status !== 404) throw err;
            }
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issueNumber,
                labels: ['scan-failed'],
              });
            } catch (_) {}

            core.summary
              .addHeading('⏱️ Analysis timed out', 2)
              .addRaw(`Issue: [#${issueNumber}](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${issueNumber})`)
              .addEOL()
              .addRaw(`Crawl URL: \`${crawlUrl}\``)
              .addEOL()
              .addRaw(`PDF limit reduced from ${currentMax} → ${newMax} for next retry.`)
              .addEOL()
              .addRaw(`[View workflow run](${runUrl})`)
              .write();
