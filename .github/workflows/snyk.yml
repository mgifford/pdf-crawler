name: Snyk Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
  push:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - "package-lock.json"
      - ".github/workflows/snyk.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - "package-lock.json"
      - ".github/workflows/snyk.yml"

permissions:
  contents: read

jobs:
  snyk-npm:
    name: Snyk npm
    runs-on: ubuntu-latest
    if: hashFiles('package-lock.json') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk npm test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=package-lock.json --package-manager=npm

  snyk-python:
    name: Snyk pip
    runs-on: ubuntu-latest
    if: hashFiles('requirements.txt') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Snyk pip test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=requirements.txt --package-manager=pip --skip-unresolved
